[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replayharness"
version = "0.1.0"
description = "Replay your own prompts against any model. Private score, not a public leaderboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nicolas Dunlap" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
anchor = "anchor.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["anchor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
